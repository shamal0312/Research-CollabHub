version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: research_collabhub_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Research-CollabHub-Backend
    env_file:
      - ./Research-CollabHub-Backend/.env
    container_name: research_collabhub_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./Research-CollabHub-Backend:/app
      - /app/node_modules

  frontend:
    build: ./Research-CollabHub-Frontend
    container_name: research_collabhub_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Research-CollabHub-Frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo-data: